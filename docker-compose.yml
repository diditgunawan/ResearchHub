services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: rf, POSTGRES_PASSWORD: rf_dev_only, POSTGRES_DB: researchforge }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U rf"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: rf_dev, MINIO_ROOT_PASSWORD: rf_dev_only_change }
    ports: ["9000:9000","9001:9001"]
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025","1025:1025"]
  api:
    build: ./apps/api
    env_file: .env
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["8000:8000"]
  worker:
    build: ./apps/api
    command: ["python","-m","app.jobs.worker"]
    env_file: .env
    depends_on: [db, redis]
  web:
    build: ./apps/web
    ports: ["5173:5173"]
    depends_on: [api]
volumes: { pgdata: {}, miniodata: {} }
